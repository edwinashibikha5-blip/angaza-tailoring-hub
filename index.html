            <div><label>Monthly Overhead</label><input type="number" id="p-ovh" value="18000" /></div>
          </div>
          <div id="proj-res" style="margin-top:8px;padding:9px;background:#0f172a;border-radius:7px;font-size:12px;"></div>
        </div>
        <div class="card">
          <h2>Material &amp; Trim Expenses + Change PIN</h2>
          <form id="exp-form" class="grid-2" style="margin-bottom:8px;">
            <input id="exp-item" placeholder="Thread, Zipper, Lining..." required />

          </div>
        </div>
      </div>
